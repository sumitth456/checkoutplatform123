# Production overrides — use: docker compose --env-file .env.docker -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  nginx:
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro

  mysql:
    ports: !override []

  redis:
    ports: !override []
