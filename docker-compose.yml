x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: checkout_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/up || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - checkout
    logging: *default-logging

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: fpm
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: checkout_app
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      RUN_SEEDERS: ${RUN_SEEDERS:-false}
      STORAGE_LINK: ${STORAGE_LINK:-true}
    volumes:
      - ./backend:/var/www/html
      - app_storage:/var/www/html/storage
      - app_cache:/var/www/html/bootstrap/cache
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 300s
    networks:
      - checkout
    logging: *default-logging

  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: worker
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: checkout_worker
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      SUPERVISOR_PROFILE: worker
      WORKER_PROCESSES: ${WORKER_PROCESSES:-2}
      RUN_MIGRATIONS: "false"
      RUN_SEEDERS: "false"
    volumes:
      - ./backend:/var/www/html
      - app_storage:/var/www/html/storage
      - app_cache:/var/www/html/bootstrap/cache
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "supervisorctl status laravel-worker:laravel-worker_00 | grep -q RUNNING"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - checkout
    logging: *default-logging

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: worker
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: checkout_scheduler
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      SUPERVISOR_PROFILE: scheduler
      RUN_MIGRATIONS: "false"
      RUN_SEEDERS: "false"
    volumes:
      - ./backend:/var/www/html
      - app_storage:/var/www/html/storage
      - app_cache:/var/www/html/bootstrap/cache
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "supervisorctl status laravel-scheduler | grep -q RUNNING"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - checkout
    logging: *default-logging

  mysql:
    image: mysql:8.4
    container_name: checkout_mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-secret}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-checkout_platform}
      MYSQL_USER: ${MYSQL_USER:-checkout}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-secret}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/conf.d:/etc/mysql/conf.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - checkout
    logging: *default-logging

  redis:
    image: redis:7-alpine
    container_name: checkout_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - checkout
    logging: *default-logging

networks:
  checkout:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  app_storage:
  app_cache:
