<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscribe Funnel Checkout</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
        label { display: block; margin-top: 1rem; font-weight: 600; }
        input, select { width: 100%; padding: 0.5rem; margin-top: 0.25rem; }
        button { margin-top: 1.5rem; padding: 0.75rem 1.5rem; background: #d97706; color: #fff; border: 0; cursor: pointer; }
        pre { background: #f3f4f6; padding: 1rem; overflow: auto; font-size: 0.85rem; }
        .error { color: #b91c1c; }
        .success { color: #15803d; }
    </style>
</head>
<body>
    <h1>Subscribe Funnel</h1>
    <p>Posts to <code id="api-endpoint"></code> (CheckoutChamp replacement)</p>

    <p id="product-hint" style="color:#92400e;background:#fef3c7;padding:0.75rem;border-radius:0.5rem;display:none;"></p>

    <form id="checkout-form">
        <label>API Base URL
            <input type="url" id="api-base" value="" placeholder="http://localhost:8080">
        </label>

        <label>Product UUID
            <input type="text" id="product_id" required placeholder="product uuid from admin">
        </label>
        <label>SKU
            <input type="text" id="sku" placeholder="optional product sku">
        </label>
        <label>Size
            <select id="size">
                <option value="S">S</option>
                <option value="M" selected>M</option>
                <option value="L">L</option>
            </select>
        </label>
        <label>Quantity
            <input type="number" id="quantity" value="1" min="1">
        </label>

        <label>Email
            <input type="email" id="email" required value="buyer@example.com">
        </label>
        <label>First name
            <input type="text" id="first_name" value="Jane">
        </label>
        <label>Last name
            <input type="text" id="last_name" value="Doe">
        </label>
        <label>Phone
            <input type="text" id="phone" value="+15551234567">
        </label>

        <label>Funnel ID (UUID)
            <input type="text" id="funnel_id" placeholder="funnel uuid">
        </label>
        <label>Campaign ID
            <input type="text" id="campaign_id" value="cmp-landing-001">
        </label>

        <button type="submit">Place Order</button>
    </form>

    <h2>Response</h2>
    <pre id="response">Submit the form to create an order.</pre>

    <script>
        const params = new URLSearchParams(window.location.search);
        const defaultBase = window.location.origin;
        const apiBaseInput = document.getElementById('api-base');
        apiBaseInput.value = params.get('api') || defaultBase;
        document.getElementById('api-endpoint').textContent = apiBaseInput.value.replace(/\/$/, '') + '/api/orders';

        ['product_id', 'sku', 'funnel_id', 'campaign_id'].forEach((key) => {
            if (params.get(key)) {
                document.getElementById(key).value = params.get(key);
            }
        });

        if (params.get('utm_source')) {
            window.__utm = {
                source: params.get('utm_source'),
                medium: params.get('utm_medium') || 'cpc',
                campaign: params.get('utm_campaign') || '',
                term: params.get('utm_term') || '',
                content: params.get('utm_content') || '',
            };
        }

        async function loadActiveProduct() {
            const base = apiBaseInput.value.replace(/\/$/, '');
            const hint = document.getElementById('product-hint');
            const productInput = document.getElementById('product_id');

            if (productInput.value) {
                return;
            }

            try {
                const response = await fetch(base + '/api/v1/products?status=active&per_page=5');
                const json = await response.json();
                const product = json.data?.[0];

                if (product) {
                    productInput.value = product.uuid;
                    document.getElementById('sku').value = product.sku || '';
                    hint.style.display = 'block';
                    hint.textContent = 'Loaded active product: ' + product.name + ' (' + product.uuid + '). Only active products can be ordered.';
                } else {
                    hint.style.display = 'block';
                    hint.textContent = 'No active products found. Create one in Admin → Products and set status to Active.';
                }
            } catch (error) {
                hint.style.display = 'block';
                hint.textContent = 'Could not load products from API. Ensure the backend server is running.';
            }
        }

        loadActiveProduct();

        document.getElementById('checkout-form').addEventListener('submit', async (event) => {
            event.preventDefault();
            const base = apiBaseInput.value.replace(/\/$/, '');
            const output = document.getElementById('response');
            output.className = '';
            output.textContent = 'Submitting...';

            const payload = {
                product_id: document.getElementById('product_id').value,
                sku: document.getElementById('sku').value || undefined,
                variant: { size: document.getElementById('size').value },
                quantity: Number(document.getElementById('quantity').value),
                customer: {
                    email: document.getElementById('email').value,
                    first_name: document.getElementById('first_name').value,
                    last_name: document.getElementById('last_name').value,
                    phone: document.getElementById('phone').value,
                },
                shipping_address: {
                    line1: '123 Main St',
                    city: 'Austin',
                    state: 'TX',
                    postal_code: '78701',
                    country: 'US',
                },
                billing_address: {
                    line1: '123 Main St',
                    city: 'Austin',
                    state: 'TX',
                    postal_code: '78701',
                    country: 'US',
                },
                funnel_id: document.getElementById('funnel_id').value || undefined,
                campaign_id: document.getElementById('campaign_id').value || undefined,
                currency: 'USD',
                country: 'US',
                utm: window.__utm || {
                    source: 'landing',
                    medium: 'web',
                    campaign: document.getElementById('campaign_id').value || 'default',
                },
                landing_page: {
                    url: window.location.href,
                    id: 'funnel-checkout-demo',
                    referrer: document.referrer || null,
                    data: { page: 'funnel-checkout.html' },
                },
            };

            try {
                const response = await fetch(base + '/api/orders', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                    },
                    body: JSON.stringify(payload),
                });

                const body = await response.json();
                output.textContent = JSON.stringify(body, null, 2);

                if (response.ok) {
                    output.className = 'success';
                    output.textContent += '\n\nNext: POST ' + base + '/api/v1/orders/' + body.data.uuid + '/checkout';
                } else {
                    output.className = 'error';
                }
            } catch (error) {
                output.className = 'error';
                output.textContent = String(error);
            }
        });
    </script>
</body>
</html>
